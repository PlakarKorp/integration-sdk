name: example
display_name: Example
description: Example Inc Inventory
homepage: https://github.com/PlakarKorp/go-inventory-sdk/tree/main/example
license: ISC
connectors:
  - type: inventory
    executable: example-inventory
    protocols: [example-inventory]
    validator: ./cmd/example-inventory/schema.json
  - type: provisioner
    executable: example-provisioner
    protocols: [example-localdir]
    class: file-storage
    validator: ./cmd/example-provisioner/schema.json
    ui: ./cmd/example-provisioner/ui.json
    extra_files: [./cmd/example-provisioner/ui.json]
